name: Linux service lifecycle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-service-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install lifecycle prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap jq shellcheck util-linux

      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          go version
          shellcheck --version
          bwrap --version
          jq --version
          setpriv --version

      - name: Build locked release daemon
        run: cargo build --locked --release -p action-brokerd

      - name: Build lifecycle transport probe
        run: go -C client-go build -trimpath -o ../target/lifecycletestclient ./internal/lifecycletestclient

      - name: Run isolated lifecycle qualification
        run: |
          sudo tests/linux-service-lifecycle.sh \
            --daemon "$PWD/target/release/action-brokerd" \
            --client "$PWD/target/lifecycletestclient"
