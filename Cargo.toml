[workspace]
members = [
    "crates/action-broker-core",
    "crates/action-brokerd",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/InspiredDev17/action-broker"

[workspace.dependencies]
base64 = "0.22.1"
cap-std = "3.4.5"
clap = { version = "4.5.50", features = ["derive"] }
ed25519-dalek = "2.2.0"
hex = "0.4.3"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
libc = "0.2.177"
parking_lot = "0.12.5"
regex = "1.12.2"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "net", "process", "thread"] }
schemars = { version = "1.0.4", features = ["uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_jcs = "0.1.0"
sha2 = "0.10.9"
signal-hook = "0.4.4"
tempfile = "3.23.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "serde"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
